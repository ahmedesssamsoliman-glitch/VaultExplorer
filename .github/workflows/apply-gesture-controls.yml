name: apply-gesture-controls
on:
  push:
    branches:
      - gesture-volume-brightness
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gesture code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/browser/viewer/widgets/media_player_widget.dart')
          s = p.read_text()
          s = s.replace("import 'package:flutter/services.dart';\n", "import 'package:flutter/services.dart';\nimport 'package:screen_brightness/screen_brightness.dart';\nimport 'package:volume_controller/volume_controller.dart';\n", 1)
          s = s.replace("  bool _isSpeedHeld = false;\n  final GlobalKey _interactiveViewerKey = GlobalKey();", "  bool _isSpeedHeld = false;\n  String? _adjustmentMode;\n  double _adjustmentStartValue = 0.0;\n  double _adjustmentValue = 0.0;\n  double _adjustmentStartDy = 0.0;\n  double _adjustmentHeight = 1.0;\n  Timer? _adjustmentIndicatorTimer;\n  bool _adjustmentBusy = false;\n  final GlobalKey _interactiveViewerKey = GlobalKey();", 1)
          s = s.replace("    _indicatorTimer?.cancel();\n    _boundController?.removeListener(_onControllerTick);", "    _indicatorTimer?.cancel();\n    _adjustmentIndicatorTimer?.cancel();\n    _boundController?.removeListener(_onControllerTick);", 1)
          marker = "  Matrix4 _calculateZoomMatrix({required Offset localPosition, required double scale}) {"
          methods = '''  Future<void> _beginAdjustment({
    required Offset localPosition,
    required double height,
  }) async {
    if (_videoScale > 1.01 || height <= 0 || _adjustmentBusy) return;
    final isVolume = localPosition.dx >= MediaQuery.of(context).size.width / 2;
    _adjustmentBusy = true;
    _adjustmentMode = isVolume ? 'volume' : 'brightness';
    _adjustmentStartDy = localPosition.dy;
    _adjustmentHeight = height;
    try {
      if (isVolume) {
        VolumeController.instance.showSystemUI = false;
        _adjustmentStartValue = (await VolumeController.instance.getVolume()).clamp(0.0, 1.0);
      } else {
        _adjustmentStartValue = (await ScreenBrightness.instance.application).clamp(0.0, 1.0);
      }
      if (!mounted || _adjustmentMode == null) return;
      _adjustmentValue = _adjustmentStartValue;
      _showAdjustmentIndicator();
    } catch (_) {
      _endAdjustment();
    } finally {
      _adjustmentBusy = false;
    }
  }

  void _updateAdjustment(DragUpdateDetails details) {
    final mode = _adjustmentMode;
    if (mode == null || _videoScale > 1.01) return;
    final travel = _adjustmentHeight * 0.55;
    if (travel <= 0) return;
    final delta = (_adjustmentStartDy - details.localPosition.dy) / travel;
    final value = (_adjustmentStartValue + delta).clamp(0.0, 1.0);
    if ((value - _adjustmentValue).abs() < 0.004) return;
    _adjustmentValue = value;
    if (mode == 'volume') {
      unawaited(VolumeController.instance.setVolume(value));
    } else {
      unawaited(ScreenBrightness.instance.setApplicationScreenBrightness(value));
    }
    _showAdjustmentIndicator();
  }

  void _showAdjustmentIndicator() {
    if (!mounted) return;
    _adjustmentIndicatorTimer?.cancel();
    setState(() {});
    _adjustmentIndicatorTimer = Timer(const Duration(milliseconds: 900), () {
      if (mounted && _adjustmentMode != null) setState(() => _adjustmentMode = null);
    });
  }

  void _endAdjustment() {
    _adjustmentIndicatorTimer?.cancel();
    if (!mounted) return;
    if (_adjustmentMode != null) setState(() => _adjustmentMode = null);
    _adjustmentStartValue = 0.0;
    _adjustmentValue = 0.0;
    _adjustmentStartDy = 0.0;
    _adjustmentHeight = 1.0;
  }

  Widget _buildAdjustmentIndicator(ColorScheme cs) {
    final mode = _adjustmentMode;
    if (mode == null) return const SizedBox.shrink();
    final value = _adjustmentValue.clamp(0.0, 1.0);
    final isVolume = mode == 'volume';
    final icon = isVolume
        ? (value <= 0.001 ? Icons.volume_off_rounded : value < 0.5 ? Icons.volume_down_rounded : Icons.volume_up_rounded)
        : (value <= 0.001 ? Icons.brightness_low_rounded : value < 0.5 ? Icons.brightness_medium_rounded : Icons.brightness_high_rounded);
    final label = isVolume ? 'Volume' : 'Brightness';
    return IgnorePointer(
      child: Center(
        child: Container(
          width: 150,
          padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 16),
          decoration: BoxDecoration(
            color: Colors.black.withValues(alpha: 0.72),
            borderRadius: BorderRadius.circular(22),
            border: Border.all(color: cs.primary.withValues(alpha: 0.35)),
          ),
          child: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              Icon(icon, color: Colors.white, size: 30),
              const SizedBox(height: 6),
              Text('$label ${(value * 100).round()}%', style: const TextStyle(color: Colors.white, fontSize: 13, fontWeight: FontWeight.w700)),
              const SizedBox(height: 10),
              ClipRRect(
                borderRadius: BorderRadius.circular(20),
                child: LinearProgressIndicator(
                  value: value,
                  minHeight: 5,
                  backgroundColor: Colors.white24,
                  valueColor: AlwaysStoppedAnimation<Color>(cs.primary),
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }

'''
          if marker not in s: raise SystemExit('zoom marker not found')
          s = s.replace(marker, methods + marker, 1)
          old = """                    onLongPressStart: _onSpeedHoldStart,\n                    onLongPressEnd: _onSpeedHoldEnd,\n                  );"""
          new = """                    onLongPressStart: _onSpeedHoldStart,\n                    onLongPressEnd: _onSpeedHoldEnd,\n                    onVerticalDragStart: _videoScale <= 1.01\n                        ? (details) => _beginAdjustment(\n                              localPosition: details.localPosition,\n                              height: constraints.maxHeight,\n                            )\n                        : null,\n                    onVerticalDragUpdate: _videoScale <= 1.01 ? _updateAdjustment : null,\n                    onVerticalDragEnd: _videoScale <= 1.01 ? (_) => _endAdjustment() : null,\n                    onVerticalDragCancel: _videoScale <= 1.01 ? _endAdjustment : null,\n                  );"""
          if old not in s: raise SystemExit('gesture marker not found')
          s = s.replace(old, new, 1)
          old = """          if (_isSpeedHeld)\n            Positioned("""
          new = """          if (_adjustmentMode != null)\n            Positioned.fill(\n              child: _buildAdjustmentIndicator(cs),\n            ),\n          if (_isSpeedHeld)\n            Positioned("""
          if old not in s: raise SystemExit('overlay marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit player changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/browser/viewer/widgets/media_player_widget.dart
          git rm .gesture-trigger 2>/dev/null || true
          git rm .github/workflows/apply-gesture-controls.yml
          git commit -m 'feat(player): add volume and brightness swipe gestures'
          git push
